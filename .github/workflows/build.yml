name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak FotoFrame.zip
        run: |
          test -f FotoFrame.zip || { echo "FotoFrame.zip tidak ada di root repo"; exit 1; }
          unzip -oq FotoFrame.zip
          ls app/src/main/assets/frames
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FotoFrame-debug
          path: app/build/outputs/apk/debug/*.apk
